<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendario de tareas – 6 al 21 de agosto</title>
<style>
  :root{
    --bg:#f4f6fa;
    --card:#ffffff;
    --text:#1e2430;
    --muted:#6b7280;
    --line:#e3e7ef;
    --accent:#2563eb;
    --ok:#16a34a;
    --shadow:0 1px 3px rgba(16,24,40,.08),0 8px 24px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box}
  body{
    margin:0;padding:0 0 60px;
    background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;
  }
  header{
    background:linear-gradient(135deg,#1e3a8a,#2563eb);
    color:#fff;padding:28px 20px 24px;box-shadow:var(--shadow);
  }
  .wrap{max-width:1000px;margin:0 auto;padding:0 16px}
  header h1{margin:0 0 4px;font-size:1.6rem;letter-spacing:-.02em}
  header p{margin:0;opacity:.85;font-size:.95rem}

  .progress-box{
    margin-top:18px;background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:14px 16px;
  }
  .progress-line{display:flex;justify-content:space-between;align-items:baseline;font-size:.9rem;margin-bottom:8px}
  .progress-line strong{font-size:1.25rem}
  .bar{height:10px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
  .bar > span{display:block;height:100%;width:0;background:#4ade80;border-radius:99px;transition:width .25s ease}

  /* ---- Panel de filtros ---- */
  .filtros{
    max-width:1000px;margin:18px auto 0;padding:14px 16px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);
  }
  .filtro-fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
  .filtro-fila:last-of-type{margin-bottom:0}
  .filtro-tit{
    font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;
    font-weight:700;color:var(--muted);width:64px;flex:none;
  }
  .chip{
    font:inherit;font-size:.78rem;font-weight:600;
    padding:5px 11px;border-radius:99px;cursor:pointer;
    border:1px solid var(--line);background:#fff;color:var(--muted);
  }
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip .pt{opacity:.7;font-weight:500}

  .acciones{
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;
    margin-top:12px;padding-top:12px;border-top:1px solid var(--line);
  }
  .acciones button{
    font:inherit;font-size:.82rem;padding:7px 13px;border-radius:9px;
    border:1px solid var(--line);background:#fff;color:var(--text);cursor:pointer;
  }
  .acciones button:hover{border-color:var(--accent);color:var(--accent)}
  .hint{font-size:.78rem;color:var(--muted)}
  #resultado{font-size:.82rem;font-weight:600;color:var(--accent)}

  main{max-width:1000px;margin:16px auto 0;padding:0 16px;display:grid;gap:16px}

  .day{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);overflow:hidden;
    transition:border-color .15s ease,background .15s ease;
  }
  .day.done{border-color:#bbf7d0}
  .day.drag-over{border-color:var(--accent);background:#f3f7ff}
  .day-head{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:14px 18px;border-bottom:1px solid var(--line);background:#fbfcfe;
  }
  .day-date{font-weight:700;font-size:1.05rem}
  .day-dow{color:var(--muted);font-size:.85rem;text-transform:capitalize}
  .day-count{margin-left:auto;font-size:.8rem;color:var(--muted);white-space:nowrap}
  .day-hits{
    font-size:.72rem;font-weight:700;color:#fff;background:var(--accent);
    padding:1px 9px;border-radius:99px;display:none;
  }
  .day.tiene-hits .day-hits{display:inline-block}
  .mini-bar{width:100%;height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:2px}
  .mini-bar > span{display:block;height:100%;width:0;background:var(--ok);transition:width .2s ease}
  .day-progress{flex-basis:120px;flex-grow:0}

  ul{list-style:none;margin:0;padding:8px 10px;min-height:52px}
  ul.vacio::after{
    content:"Sin actividades · suelta una tarea aquí";
    display:block;text-align:center;color:var(--muted);font-size:.82rem;
    padding:12px 6px;border:1px dashed var(--line);border-radius:10px;
  }
  li{border-radius:10px;display:flex;align-items:center;gap:4px;background:#fff;
     transition:opacity .15s ease,background .15s ease,box-shadow .15s ease}
  li + li{margin-top:2px}
  li.dragging{opacity:.4}
  li.drop-target{box-shadow:inset 0 2px 0 var(--accent)}
  /* Resaltado del filtro */
  li.apagada{opacity:.28}
  li.resaltada{background:#fffbeb;box-shadow:0 0 0 2px #fbbf24 inset;opacity:1}

  .handle{
    flex:none;cursor:grab;color:#c3c9d6;font-size:1rem;line-height:1;
    padding:10px 2px 10px 6px;user-select:none;
  }
  .handle:active{cursor:grabbing}

  label{display:flex;align-items:flex-start;gap:11px;padding:9px 6px;
        border-radius:10px;cursor:pointer;flex:1;min-width:0}
  label:hover{background:rgba(0,0,0,.02)}
  input[type=checkbox]{width:20px;height:20px;margin:2px 0 0;flex:none;cursor:pointer;accent-color:var(--accent)}
  .task-text{display:flex;flex-direction:column;min-width:0;gap:1px}
  .task-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .task-subject{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
  .task-name{font-size:.98rem}
  .task-limite{font-size:.74rem;color:var(--muted)}
  .task-limite.pronto{color:#b45309;font-weight:600}
  .task-limite.tarde{color:#b91c1c;font-weight:700}
  input:checked ~ .task-text .task-name{text-decoration:line-through;color:var(--muted)}
  input:checked ~ .task-text .task-subject,
  input:checked ~ .task-text .tipo{opacity:.5}

  /* ---- Distintivo por tipo de actividad ---- */
  .tipo{
    display:inline-block;padding:1px 9px;border-radius:6px;
    font-size:.68rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
    border:1px solid transparent;white-space:nowrap;
  }
  .t-tarea      {background:#dbeafe;color:#1d4ed8;border-color:#bfdbfe}
  .t-evaluacion {background:#fef3c7;color:#b45309;border-color:#fde68a}
  .t-asignacion {background:#ccfbf1;color:#0f766e;border-color:#99f6e4}
  .t-parcial    {background:#ede9fe;color:#6d28d9;border-color:#ddd6fe}
  .t-final      {background:#fee2e2;color:#b91c1c;border-color:#fecaca}
  .t-caso       {background:#fce7f3;color:#be185d;border-color:#fbcfe8}
  .t-quiz       {background:#cffafe;color:#0e7490;border-color:#a5f3fc}
  .t-taller     {background:#dcfce7;color:#15803d;border-color:#bbf7d0}
  .t-cuestionario{background:#e0e7ff;color:#4338ca;border-color:#c7d2fe}

  .mover{
    flex:none;font:inherit;font-size:.75rem;color:var(--muted);
    border:1px solid var(--line);border-radius:8px;background:#fff;
    padding:5px 6px;margin-right:6px;cursor:pointer;max-width:130px;
  }
  .mover:hover{border-color:var(--accent);color:var(--accent)}

  footer{text-align:center;color:var(--muted);font-size:.85rem;margin-top:32px}

  @media (max-width:600px){
    header h1{font-size:1.3rem}
    .day-count{margin-left:0;width:100%}
    .day-progress{flex-basis:100%}
    .filtro-tit{width:100%}
    .mover{max-width:88px}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>Calendario de tareas – 6 al 21 de agosto</h1>
    <p>Plan de estudio distribuido · 51 actividades en 16 días</p>
    <div class="progress-box">
      <div class="progress-line">
        <span>Progreso general</span>
        <span><strong id="pct">0%</strong> &nbsp;<span id="frac">(0 / 0)</span></span>
      </div>
      <div class="bar"><span id="barFill"></span></div>
    </div>
  </div>
</header>

<section class="filtros">
  <div class="filtro-fila" id="filtroTipo">
    <span class="filtro-tit">Tipo</span>
  </div>
  <div class="filtro-fila" id="filtroMateria">
    <span class="filtro-tit">Materia</span>
  </div>
  <div class="acciones">
    <button type="button" id="btnLimpiar">Quitar filtros</button>
    <button type="button" id="btnToday">Ir a hoy</button>
    <button type="button" id="btnOrden">Restaurar orden sugerido</button>
    <span id="resultado"></span>
    <span class="hint">Arrastra las tareas entre días o usa el selector de fecha de cada tarea.</span>
  </div>
</section>

<main id="calendario"></main>

<footer>Powered by Yasser G. ⚡</footer>

<script>
(function(){
  "use strict";

  var KEY_DONE   = "calendario-agosto-2026-hechas";
  var KEY_LAYOUT = "calendario-agosto-2026-orden";
  var KEY_VER    = "calendario-agosto-2026-version";

  // Al cambiar la distribución sugerida se sube esta versión: el orden guardado
  // se reemplaza por el nuevo plan. Las actividades marcadas NO se tocan,
  // porque viven en otra clave y se identifican por id, no por fecha.
  var PLAN_VERSION = 2;

  var FECHAS = [
    "2026-08-06","2026-08-07","2026-08-08","2026-08-09","2026-08-10","2026-08-11",
    "2026-08-12","2026-08-13","2026-08-14","2026-08-15","2026-08-16","2026-08-17",
    "2026-08-18","2026-08-19","2026-08-20","2026-08-21"
  ];

  var DIAS  = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
  var MESES = ["enero","febrero","marzo","abril","mayo","junio","julio",
               "agosto","septiembre","octubre","noviembre","diciembre"];
  var MES_C = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

  // Tipos de actividad (clase de color + etiqueta visible)
  var TIPOS = {
    tarea:       { et:"Tarea",       cls:"t-tarea" },
    evaluacion:  { et:"Evaluación",  cls:"t-evaluacion" },
    asignacion:  { et:"Asignación",  cls:"t-asignacion" },
    parcial:     { et:"Parcial",     cls:"t-parcial" },
    final:       { et:"Final",       cls:"t-final" },
    caso:        { et:"Caso",        cls:"t-caso" },
    quiz:        { et:"Quiz",        cls:"t-quiz" },
    taller:      { et:"Taller",      cls:"t-taller" },
    cuestionario:{ et:"Cuestionario",cls:"t-cuestionario" }
  };

  var DER = "Derecho fiscal y laboral",
      CC  = "Contabilidad de costos",
      F2  = "Finanzas 2",
      ES  = "Estadística 1",
      ET  = "Ética profesional";

  // Fechas límite conocidas por materia
  var LIM_CC = "2026-08-23";   // Contabilidad de costos: todo el 23 de agosto
  var LIM_F2 = "2026-08-22";   // Finanzas 2: todo el 22 de agosto

  // Catálogo. El id es fijo: al mover una tarea de día conserva su estado.
  // Totales -> Derecho 2 | Contabilidad 30 | Finanzas 8 | Estadística 3 | Ética 8 = 51
  var TAREAS = {};
  function def(id, m, t, tipo, limite){
    TAREAS[id] = { id:id, m:m, t:t, tipo:tipo, limite:limite || null };
  }

  def("der-parcial", DER, "Parcial", "parcial", null);
  def("der-final",   DER, "Actividad final", "final", null);

  for (var i = 1; i <= 14; i++) def("cc-tarea-" + i, CC, "Tarea " + i, "tarea", LIM_CC);
  for (var j = 1; j <= 11; j++) def("cc-eval-" + j,  CC, "Evaluación " + j, "evaluacion", LIM_CC);
  def("cc-caso",      CC, "Caso de estudio",  "caso",    LIM_CC);
  def("cc-parcial-1", CC, "Parcial 1",        "parcial", LIM_CC);
  def("cc-parcial-2", CC, "Parcial 2",        "parcial", LIM_CC);
  def("cc-parcial-3", CC, "Parcial 3",        "parcial", LIM_CC);
  def("cc-final",     CC, "Evaluación final", "final",   LIM_CC);

  def("f2-quiz", F2, "Quiz", "quiz", LIM_F2);
  def("f2-caso", F2, "Caso de estudio", "caso", LIM_F2);
  for (var k = 1; k <= 6; k++) def("f2-asig-" + k, F2, "Asignación " + k, "asignacion", LIM_F2);

  def("es-cuestionario", ES, "Cuestionario", "cuestionario", null);
  def("es-taller",       ES, "Taller",       "taller",  "2026-08-07");
  def("es-parcial-2",    ES, "Parcial 2",    "parcial", "2026-08-08");

  for (var e = 1; e <= 7; e++) def("et-eval-" + e, ET, "Evaluación " + e, "evaluacion", null);
  def("et-final", ET, "Examen final", "final", null);

  // Distribución sugerida: lo que vence dentro del rango se hace al menos
  // un día antes de su fecha límite (taller vence el 7 -> se hace el 6,
  // parcial 2 vence el 8 -> se hace el 7).
  var ORDEN_SUGERIDO = {
    "2026-08-06": ["es-cuestionario","es-taller","cc-tarea-1","et-eval-1"],
    "2026-08-07": ["es-parcial-2","cc-tarea-2","cc-tarea-3","cc-eval-1"],
    "2026-08-08": ["cc-tarea-4","cc-eval-2","et-eval-2","et-eval-3"],
    "2026-08-09": ["cc-tarea-5","cc-eval-3","et-eval-4"],
    "2026-08-10": ["der-parcial","cc-tarea-6","cc-eval-4","f2-asig-1"],
    "2026-08-11": ["cc-tarea-7","cc-eval-5","f2-asig-2","et-eval-5"],
    "2026-08-12": ["cc-parcial-1","cc-tarea-8","cc-eval-6","f2-quiz"],
    "2026-08-13": ["cc-tarea-9","cc-eval-7","f2-asig-3","et-eval-6"],
    "2026-08-14": ["cc-tarea-10","cc-eval-8","f2-asig-4","et-eval-7"],
    "2026-08-15": ["cc-tarea-11","cc-eval-9","f2-caso"],
    "2026-08-16": ["cc-tarea-12","cc-eval-10","f2-asig-5"],
    "2026-08-17": ["cc-tarea-13","cc-eval-11","f2-asig-6"],
    "2026-08-18": ["cc-tarea-14","cc-caso"],
    "2026-08-19": ["cc-parcial-2","der-final"],
    "2026-08-20": ["cc-parcial-3","et-final"],
    "2026-08-21": ["cc-final"]
  };

  // ---- Almacenamiento ------------------------------------------------------

  function leer(key, fallback){
    try {
      var v = JSON.parse(localStorage.getItem(key));
      return v && typeof v === "object" ? v : fallback;
    } catch(e){ return fallback; }
  }
  function escribir(key, obj){
    try { localStorage.setItem(key, JSON.stringify(obj)); } catch(e){}
  }
  function clonar(o){ return JSON.parse(JSON.stringify(o)); }

  // Garantiza que cada tarea aparezca exactamente una vez; repara sin perder
  // los cambios que el usuario ya hizo.
  function sanear(layout){
    var limpio = {}, vistos = {};
    FECHAS.forEach(function(f){
      limpio[f] = [];
      (Array.isArray(layout[f]) ? layout[f] : []).forEach(function(id){
        if(TAREAS[id] && !vistos[id]){ vistos[id] = true; limpio[f].push(id); }
      });
    });
    FECHAS.forEach(function(f){
      ORDEN_SUGERIDO[f].forEach(function(id){
        if(!vistos[id]){ vistos[id] = true; limpio[f].push(id); }
      });
    });
    return limpio;
  }

  var hechas = leer(KEY_DONE, {});

  var layout;
  var verGuardada = null;
  try { verGuardada = +localStorage.getItem(KEY_VER); } catch(e){}

  if(verGuardada !== PLAN_VERSION){
    // Plan nuevo: se adopta la distribución sugerida actualizada
    layout = clonar(ORDEN_SUGERIDO);
    escribir(KEY_LAYOUT, layout);
    try { localStorage.setItem(KEY_VER, String(PLAN_VERSION)); } catch(e){}
  } else {
    layout = sanear(leer(KEY_LAYOUT, clonar(ORDEN_SUGERIDO)));
  }

  var TOTAL = Object.keys(TAREAS).length;

  var filtroTipo = "";     // "" = todos
  var filtroMateria = "";  // "" = todas

  var contenedor = document.getElementById("calendario");
  var barFill  = document.getElementById("barFill");
  var pctEl    = document.getElementById("pct");
  var fracEl   = document.getElementById("frac");
  var resultado= document.getElementById("resultado");

  function fparse(iso){ var p = iso.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
  function etiquetaFecha(iso){
    var d = fparse(iso);
    return { dia:d.getDate(), mes:MESES[d.getMonth()], dow:DIAS[d.getDay()], corta:d.getDate()+" "+MES_C[d.getMonth()] };
  }

  // ---- Construcción del DOM ------------------------------------------------

  function crearItem(id, fechaDia){
    var tarea = TAREAS[id];
    var tipo  = TIPOS[tarea.tipo];

    var li = document.createElement("li");
    li.draggable = true;
    li.dataset.id = id;
    li.dataset.tipo = tarea.tipo;
    li.dataset.materia = tarea.m;

    var handle = document.createElement("span");
    handle.className = "handle";
    handle.title = "Arrastra para mover esta tarea a otro día";
    handle.textContent = "⣿";

    var label = document.createElement("label");

    var cb = document.createElement("input");
    cb.type = "checkbox";
    cb.dataset.id = id;
    cb.checked = !!hechas[id];

    var txt = document.createElement("span");
    txt.className = "task-text";
    txt.innerHTML =
      '<span class="task-top">' +
        '<span class="tipo ' + tipo.cls + '">' + tipo.et + '</span>' +
        '<span class="task-subject">' + tarea.m + '</span>' +
      '</span>' +
      '<span class="task-name">' + tarea.t + '</span>' +
      '<span class="task-limite" data-limite></span>';

    label.appendChild(cb);
    label.appendChild(txt);

    var sel = document.createElement("select");
    sel.className = "mover";
    sel.title = "Mover esta tarea a otro día";
    FECHAS.forEach(function(f){
      var op = document.createElement("option");
      op.value = f;
      op.textContent = etiquetaFecha(f).dia + " ago";
      sel.appendChild(op);
    });
    sel.value = fechaDia;

    li.appendChild(handle);
    li.appendChild(label);
    li.appendChild(sel);
    return li;
  }

  // Texto de fecha límite + aviso si queda programada demasiado cerca del cierre
  function pintarLimite(li, fechaDia){
    var tarea = TAREAS[li.dataset.id];
    var el = li.querySelector("[data-limite]");
    el.className = "task-limite";

    if(!tarea.limite){
      el.textContent = "(sin fecha límite informada)";
      return;
    }
    var lim = etiquetaFecha(tarea.limite);
    var dias = Math.round((fparse(tarea.limite) - fparse(fechaDia)) / 86400000);

    el.textContent = "(límite: " + lim.dia + " de " + lim.mes + ")";
    if(dias <= 0){
      el.textContent = "(límite: " + lim.dia + " de " + lim.mes + " · ⚠ va justa o tarde)";
      el.classList.add("tarde");
    } else if(dias === 1){
      el.textContent = "(límite: " + lim.dia + " de " + lim.mes + " · un día antes ✓)";
      el.classList.add("pronto");
    }
  }

  function render(){
    contenedor.innerHTML = "";
    FECHAS.forEach(function(fecha){
      var info = etiquetaFecha(fecha);

      var card = document.createElement("section");
      card.className = "day";
      card.id = "dia-" + fecha;
      card.dataset.fecha = fecha;

      var head = document.createElement("div");
      head.className = "day-head";
      head.innerHTML =
        '<span class="day-date">' + info.dia + " de " + info.mes + '</span>' +
        '<span class="day-dow">' + info.dow + '</span>' +
        '<span class="day-hits" data-hits></span>' +
        '<span class="day-count" data-count></span>' +
        '<span class="day-progress"><span class="mini-bar"><span data-mini></span></span></span>';

      var ul = document.createElement("ul");
      ul.dataset.fecha = fecha;
      layout[fecha].forEach(function(id){ ul.appendChild(crearItem(id, fecha)); });

      card.appendChild(head);
      card.appendChild(ul);
      contenedor.appendChild(card);
    });
    actualizar();
    aplicarFiltro();
  }

  // ---- Progreso ------------------------------------------------------------

  function actualizar(){
    var completas = 0;

    Array.prototype.forEach.call(contenedor.querySelectorAll(".day"), function(card){
      var fecha = card.dataset.fecha;
      var items = card.querySelectorAll("li");
      var n = items.length, ok = 0;

      Array.prototype.forEach.call(items, function(li){
        pintarLimite(li, fecha);
        if(li.querySelector("input").checked) ok++;
      });
      completas += ok;

      var pctDia = n ? Math.round(ok * 100 / n) : 0;
      card.querySelector("[data-count]").textContent = n
        ? ok + " / " + n + " · " + pctDia + "%"
        : "sin actividades";
      card.querySelector("[data-mini]").style.width = pctDia + "%";
      card.classList.toggle("done", n > 0 && ok === n);
      card.querySelector("ul").classList.toggle("vacio", n === 0);
    });

    var pct = TOTAL ? Math.round(completas * 100 / TOTAL) : 0;
    pctEl.textContent = pct + "%";
    fracEl.textContent = "(" + completas + " / " + TOTAL + ")";
    barFill.style.width = pct + "%";
  }

  function guardarOrden(){
    var nuevo = {};
    Array.prototype.forEach.call(contenedor.querySelectorAll("ul"), function(ul){
      nuevo[ul.dataset.fecha] = Array.prototype.map.call(
        ul.querySelectorAll("li"), function(li){ return li.dataset.id; }
      );
      Array.prototype.forEach.call(ul.querySelectorAll(".mover"), function(sel){
        sel.value = ul.dataset.fecha;
      });
    });
    layout = nuevo;
    escribir(KEY_LAYOUT, layout);
    actualizar();
    aplicarFiltro();
  }

  // ---- Filtros que resaltan -----------------------------------------------

  function aplicarFiltro(){
    var activo = !!(filtroTipo || filtroMateria);
    var hits = 0;

    Array.prototype.forEach.call(contenedor.querySelectorAll(".day"), function(card){
      var hitsDia = 0;
      Array.prototype.forEach.call(card.querySelectorAll("li"), function(li){
        var ok = (!filtroTipo    || li.dataset.tipo    === filtroTipo) &&
                 (!filtroMateria || li.dataset.materia === filtroMateria);
        li.classList.toggle("resaltada", activo && ok);
        li.classList.toggle("apagada",   activo && !ok);
        if(activo && ok){ hitsDia++; hits++; }
      });
      card.classList.toggle("tiene-hits", hitsDia > 0);
      card.querySelector("[data-hits]").textContent = hitsDia;
    });

    if(!activo){ resultado.textContent = ""; return; }
    var partes = [];
    if(filtroTipo) partes.push(TIPOS[filtroTipo].et.toLowerCase());
    if(filtroMateria) partes.push(filtroMateria);
    resultado.textContent = hits + (hits === 1 ? " actividad" : " actividades") +
                            " · " + partes.join(" · ");
  }

  function construirFiltros(){
    var filaTipo = document.getElementById("filtroTipo");
    var filaMat  = document.getElementById("filtroMateria");

    function chip(fila, texto, valor, grupo, conteo){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.dataset.grupo = grupo;
      b.dataset.valor = valor;
      b.innerHTML = texto + (conteo != null ? ' <span class="pt">' + conteo + '</span>' : '');
      b.addEventListener("click", function(){
        if(grupo === "tipo")    filtroTipo    = (filtroTipo    === valor) ? "" : valor;
        else                    filtroMateria = (filtroMateria === valor) ? "" : valor;
        pintarChips();
        aplicarFiltro();
      });
      fila.appendChild(b);
      return b;
    }

    var porTipo = {}, porMateria = {};
    Object.keys(TAREAS).forEach(function(id){
      var t = TAREAS[id];
      porTipo[t.tipo] = (porTipo[t.tipo] || 0) + 1;
      porMateria[t.m] = (porMateria[t.m] || 0) + 1;
    });

    Object.keys(TIPOS).forEach(function(k){
      if(porTipo[k]) chip(filaTipo, TIPOS[k].et, k, "tipo", porTipo[k]);
    });
    [ES, CC, F2, DER, ET].forEach(function(m){
      chip(filaMat, m, m, "materia", porMateria[m]);
    });
  }

  function pintarChips(){
    Array.prototype.forEach.call(document.querySelectorAll(".chip"), function(b){
      var v = b.dataset.valor;
      var on = (b.dataset.grupo === "tipo") ? (filtroTipo === v) : (filtroMateria === v);
      b.classList.toggle("on", on);
    });
  }

  // ---- Eventos -------------------------------------------------------------

  contenedor.addEventListener("change", function(ev){
    var el = ev.target;

    if(el.type === "checkbox"){
      if(el.checked) hechas[el.dataset.id] = true;
      else delete hechas[el.dataset.id];
      escribir(KEY_DONE, hechas);
      actualizar();
      return;
    }

    if(el.classList.contains("mover")){
      var li = el.closest("li");
      var destino = contenedor.querySelector('ul[data-fecha="' + el.value + '"]');
      if(li && destino){
        destino.appendChild(li);
        guardarOrden();
        li.scrollIntoView({ behavior:"smooth", block:"center" });
      }
    }
  });

  var arrastrando = null;

  contenedor.addEventListener("dragstart", function(ev){
    var li = ev.target.closest("li");
    if(!li) return;
    arrastrando = li;
    li.classList.add("dragging");
    ev.dataTransfer.effectAllowed = "move";
    try { ev.dataTransfer.setData("text/plain", li.dataset.id); } catch(e){}
  });

  contenedor.addEventListener("dragend", function(){
    if(arrastrando) arrastrando.classList.remove("dragging");
    arrastrando = null;
    limpiarPistas();
  });

  function limpiarPistas(){
    Array.prototype.forEach.call(contenedor.querySelectorAll(".drag-over"),
      function(c){ c.classList.remove("drag-over"); });
    Array.prototype.forEach.call(contenedor.querySelectorAll(".drop-target"),
      function(c){ c.classList.remove("drop-target"); });
  }

  function refDespuesDe(ul, y){
    var items = Array.prototype.slice.call(ul.querySelectorAll("li:not(.dragging)"));
    for(var i = 0; i < items.length; i++){
      var r = items[i].getBoundingClientRect();
      if(y < r.top + r.height / 2) return items[i];
    }
    return null;
  }

  contenedor.addEventListener("dragover", function(ev){
    if(!arrastrando) return;
    var ul = ev.target.closest("ul");
    if(!ul) return;
    ev.preventDefault();
    ev.dataTransfer.dropEffect = "move";
    limpiarPistas();
    ul.closest(".day").classList.add("drag-over");
    var ref = refDespuesDe(ul, ev.clientY);
    if(ref) ref.classList.add("drop-target");
  });

  contenedor.addEventListener("drop", function(ev){
    if(!arrastrando) return;
    var ul = ev.target.closest("ul");
    if(!ul) return;
    ev.preventDefault();
    var ref = refDespuesDe(ul, ev.clientY);
    if(ref) ul.insertBefore(arrastrando, ref);
    else ul.appendChild(arrastrando);
    arrastrando.classList.remove("dragging");
    arrastrando = null;
    limpiarPistas();
    guardarOrden();
  });

  document.getElementById("btnLimpiar").addEventListener("click", function(){
    filtroTipo = ""; filtroMateria = "";
    pintarChips();
    aplicarFiltro();
  });

  document.getElementById("btnToday").addEventListener("click", function(){
    var hoy = new Date();
    var iso = hoy.getFullYear() + "-" +
              String(hoy.getMonth() + 1).padStart(2, "0") + "-" +
              String(hoy.getDate()).padStart(2, "0");
    var card = document.getElementById("dia-" + iso) || contenedor.firstElementChild;
    if(card) card.scrollIntoView({ behavior:"smooth", block:"start" });
  });

  document.getElementById("btnOrden").addEventListener("click", function(){
    if(!confirm("¿Volver a la distribución sugerida? Tus actividades marcadas se conservan.")) return;
    layout = clonar(ORDEN_SUGERIDO);
    escribir(KEY_LAYOUT, layout);
    render();
  });

  construirFiltros();
  render();
})();
</script>

</body>
</html>
